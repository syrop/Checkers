plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'pl.org.seva.checkers.ui'
    compileSdk=37

    defaultConfig {
        minSdk 21
        targetSdk 37
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    implementation "com.google.dagger:hilt-android:2.60.1"
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.0'
    ksp "com.google.dagger:hilt-compiler:2.60.1"
    implementation 'androidx.fragment:fragment-ktx:1.9.0'

    implementation 'androidx.compose.ui:ui:1.12.0'
    implementation 'androidx.compose.ui:ui-tooling:1.12.0'
    implementation 'androidx.compose.foundation:foundation:1.12.0'
    implementation 'androidx.compose.material:material:1.12.0'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.runtime:runtime-livedata:1.12.0'
    implementation 'androidx.compose.runtime:runtime-rxjava2:1.12.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.0'

    implementation project(':checkers-presentation')
}
